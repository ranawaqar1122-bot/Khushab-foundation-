<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خوشاب فاؤنڈیشن — ایڈمن پینل</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login">
  <div class="card login-card">
    <h1>خوشاب فاؤنڈیشن</h1><p>ایڈمن پینل</p>
    <input id="user" placeholder="یوزرنیم" value="admin">
    <input id="pass" type="password" placeholder="پاس ورڈ">
    <button onclick="login()">لاگ اِن</button>
    <small>پہلی بار لاگ اِن: admin / 1234</small>
  </div>
</div>

<div id="app" class="hidden">
<header><div><b>خوشاب فاؤنڈیشن</b><span> ایڈمن پینل</span></div><button class="danger" onclick="logout()">لاگ آؤٹ</button></header>
<main>
<section class="stats">
<div><b id="memberCount">0</b><span>کل ممبران</span></div>
<div><b id="fundTotal">0</b><span>کل فنڈ</span></div>
<div><b id="paidTotal">0</b><span>جمع شدہ</span></div>
<div><b id="dueTotal">0</b><span>باقی</span></div>
</section>

<section class="card">
<h2>ممبر / فنڈ شامل کریں</h2>
<form id="memberForm">
<input id="name" required placeholder="نام">
<input id="date" type="date" required>
<input id="fund" type="number" min="0" required placeholder="کل فنڈ">
<input id="paid" type="number" min="0" required placeholder="جمع شدہ رقم">
<input id="city" placeholder="سٹی">
<input id="saudi" placeholder="سعودی نمبر">
<input id="pak" placeholder="پاکستانی نمبر">
<button>محفوظ کریں</button>
</form>
</section>

<section class="card">
<div class="row"><h2>ممبران</h2><input id="search" placeholder="نام/سٹی تلاش کریں" oninput="render()"><button onclick="exportCSV()">CSV ایکسپورٹ</button></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>نام</th><th>تاریخ</th><th>سٹی</th><th>کل فنڈ</th><th>جمع</th><th>باقی</th><th>عمل</th></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
</main>
</div>
<script src="app.js"></script>
</body></html>
