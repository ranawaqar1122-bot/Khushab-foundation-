<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خوشاب فاؤنڈیشن - ایڈمن پینل</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#004d40,#00796b,#003c35);
  min-height:100vh;
  color:#17332f;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:500px;
  background:white;
  border-radius:30px;
  padding:35px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  text-align:center;
}

.logo{
  font-size:70px;
  margin-bottom:10px;
}

h1{
  margin:5px 0 10px;
  color:#00695c;
  font-size:36px;
}

.subtitle{
  color:#6b7280;
  font-size:19px;
  margin-bottom:30px;
}

label{
  display:block;
  text-align:right;
  font-weight:bold;
  font-size:18px;
  margin:18px 0 8px;
}

input{
  width:100%;
  padding:17px;
  border:2px solid #ddd;
  border-radius:15px;
  font-size:18px;
  outline:none;
  direction:ltr;
}

input:focus{
  border-color:#00796b;
}

button{
  width:100%;
  margin-top:25px;
  padding:17px;
  border:0;
  border-radius:15px;
  background:#00695c;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#004d40;
}

#error{
  display:none;
  color:#c62828;
  font-weight:bold;
  margin-top:18px;
  font-size:17px;
}

#panel{
  display:none;
  min-height:100vh;
  background:#f4f7f6;
}

header{
  background:linear-gradient(135deg,#004d40,#00796b);
  color:white;
  padding:25px;
  text-align:center;
}

header h1{
  color:white;
  margin:0;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  text-align:center;
}

.card .icon{
  font-size:45px;
}

.card h2{
  margin:10px 0;
  color:#00695c;
}

.logout{
  background:#c62828;
  max-width:250px;
  display:block;
  margin:30px auto;
}

@media(max-width:600px){
  h1{
    font-size:30px;
  }

  .login-box{
    padding:28px 20px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">

  <div class="login-box">

    <div class="logo">🕌</div>

    <h1>خوشاب فاؤنڈیشن</h1>

    <div class="subtitle">
      ایڈمن پینل میں خوش آمدید
    </div>

    <label>ایڈمن یوزرنیم</label>
    <input
      type="text"
      id="username"
      placeholder="admin"
      autocomplete="username"
    >

    <label>پاسورڈ</label>
    <input
      type="password"
      id="password"
      placeholder="Khushab@2026"
      autocomplete="current-password"
    >

    <button onclick="login()">
      🔐 لاگ اِن کریں
    </button>

    <div id="error">
      یوزرنیم یا پاسورڈ غلط ہے
    </div>

  </div>

</div>


<!-- ADMIN PANEL -->
<div id="panel">

  <header>
    <h1>خوشاب فاؤنڈیشن — ایڈمن پینل</h1>
  </header>

  <div class="container">

    <div class="cards">

      <div class="card">
        <div class="icon">👥</div>
        <h2>ممبرز</h2>
        <p>تمام ممبرز کا ریکارڈ</p>
      </div>

      <div class="card">
        <div class="icon">💰</div>
        <h2>فنڈز</h2>
        <p>فنڈز کا مکمل ریکارڈ</p>
      </div>

      <div class="card">
        <div class="icon">💳</div>
        <h2>ادائیگیاں</h2>
        <p>تمام Payments</p>
      </div>

      <div class="card">
        <div class="icon">🪪</div>
        <h2>ID Card</h2>
        <p>ممبر کا شناختی کارڈ</p>
      </div>

    </div>

    <button class="logout" onclick="logout()">
      🚪 لاگ آؤٹ
    </button>

  </div>

</div>


<script>

function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  /*
    نیا لاگ اِن:
    Username: admin
    Password: Khushab@2026
  */

  if(
    username === "admin" &&
    password === "Khushab@2026"
  ){

    document.getElementById("loginPage").style.display="none";
    document.getElementById("panel").style.display="block";

    document.getElementById("error").style.display="none";

    sessionStorage.setItem("khushab_admin","true");

  }else{

    document.getElementById("error").style.display="block";

  }
}


function logout(){

  sessionStorage.removeItem("khushab_admin");

  document.getElementById("panel").style.display="none";
  document.getElementById("loginPage").style.display="flex";

  document.getElementById("username").value="";
  document.getElementById("password").value="";
}


// اگر پہلے سے لاگ اِن ہے
if(sessionStorage.getItem("khushab_admin")==="true"){

  document.getElementById("loginPage").style.display="none";
  document.getElementById("panel").style.display="block";

}

</script>

</body>
</html>
