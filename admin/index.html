<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خوشاب فاؤنڈیشن — ایڈمن لاگ اِن</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f6f8;
      color: #172b2b;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      color: #062b2b;
      font-size: 30px;
    }

    .logo p {
      margin-top: 8px;
      color: #666;
      font-size: 15px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #062b2b;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #062b2b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b4141;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #ffe5e5;
      color: #b00020;
      border-radius: 8px;
      text-align: center;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #062b2b;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .content {
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin: 0;
      color: #062b2b;
    }

    .logout {
      max-width: 200px;
      margin: 30px auto;
      display: block;
      background: #a00000;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="login-page" id="loginPage">

    <div class="login-box">

      <div class="logo">
        <h1>خوشاب فاؤنڈیشن</h1>
        <p>ایڈمن پینل</p>
      </div>

      <label for="username">یوزرنیم</label>
      <input
        type="text"
        id="username"
        placeholder="یوزرنیم لکھیں"
        autocomplete="username"
      >

      <label for="password">پاسورڈ</label>
      <input
        type="password"
        id="password"
        placeholder="پاسورڈ لکھیں"
        autocomplete="current-password"
      >

      <button onclick="login()">لاگ اِن کریں</button>

      <div class="error" id="error">
        یوزرنیم یا پاسورڈ غلط ہے۔
      </div>

    </div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div class="dashboard" id="dashboard">

    <header>
      <h1>خوشاب فاؤنڈیشن</h1>
      <p>ایڈمن پینل</p>
    </header>

    <div class="content">

      <div class="cards">

        <div class="card">
          <h2>0</h2>
          <p>کل ممبران</p>
        </div>

        <div class="card">
          <h2>0</h2>
          <p>کل فنڈ</p>
        </div>

        <div class="card">
          <h2>0</h2>
          <p>اس سال کا فنڈ</p>
        </div>

      </div>

      <button class="logout" onclick="logout()">
        لاگ آؤٹ
      </button>

    </div>

  </div>


  <script>
    function login() {

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      if (username === "admin" && password === "12345") {

        document.getElementById("loginPage").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

        sessionStorage.setItem("adminLoggedIn", "true");

      } else {

        document.getElementById("error").style.display = "block";

      }
    }

    function logout() {

      sessionStorage.removeItem("adminLoggedIn");

      document.getElementById("dashboard").style.display = "none";

      document.getElementById("loginPage").style.display = "flex";

      document.getElementById("username").value = "";

      document.getElementById("password").value = "";

      document.getElementById("error").style.display = "none";
    }

    window.onload = function() {

      if (sessionStorage.getItem("adminLoggedIn") === "true") {

        document.getElementById("loginPage").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

      }

    };
  </script>

</body>
</html>
