<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاد اوورسیز فاؤنڈیشن - ایڈمن</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f6f8;color:#172033}
header{background:linear-gradient(135deg,#123b2a,#1d6b49);color:#fff;padding:22px;text-align:center}
header h1{margin:0 0 6px;font-size:26px}header p{margin:0}
.container{max-width:1100px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #00000012}
h2{margin-top:0;font-size:21px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{font-weight:bold;font-size:14px}input,select{width:100%;margin-top:6px;padding:11px;border:1px solid #ccd4dc;border-radius:9px;font-size:15px}
button{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:bold}
.primary{background:#176b49;color:#fff}.secondary{background:#e8eef2}.danger{background:#a52b2b;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px;border-bottom:1px solid #e1e6eb;text-align:right}th{background:#f1f5f7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{padding:16px;border-radius:12px;background:#eef7f2}.stat b{display:block;font-size:24px;margin-top:5px}
.small{font-size:13px;color:#667085}
@media(max-width:600px){table{font-size:12px}.hide-mobile{display:none}}
@media print{header,.no-print,.form-card{display:none!important}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
<h1>شاد اوورسیز فاؤنڈیشن</h1>
<p>فنڈ مینجمنٹ — ایڈمن پینل</p>
</header>

<div class="container">
<div class="card stats">
<div class="stat">کل افراد<b id="peopleCount">0</b></div>
<div class="stat">کل جمع فنڈ<b id="totalFund">0</b></div>
<div class="stat">اس ماہ<b id="monthFund">0</b></div>
</div>

<div class="card form-card">
<h2>نیا ریکارڈ شامل کریں</h2>
<div class="form">
<div><label>نام</label><input id="name" placeholder="نام لکھیں"></div>
<div><label>پتہ</label><input id="address" placeholder="پتہ"></div>
<div><label>شہر</label><input id="city" placeholder="شہر"></div>
<div><label>سعودیہ نمبر</label><input id="saudi" placeholder="+966..."></div>
<div><label>پاکستان نمبر</label><input id="pak" placeholder="+92..."></div>
<div><label>فنڈ</label><input id="fund" type="number" min="0" placeholder="رقم"></div>
<div><label>تاریخ</label><input id="date" type="date"></div>
<div><label>مہینہ</label><input id="month" type="month"></div>
</div>
<div class="actions">
<button class="primary" onclick="addRecord()">ریکارڈ محفوظ کریں</button>
<button class="secondary" onclick="clearForm()">فارم صاف کریں</button>
</div>
<p class="small">ڈیٹا اسی براؤزر میں محفوظ ہوتا ہے۔</p>
</div>

<div class="card">
<h2>فنڈ ریکارڈ</h2>
<div class="actions no-print">
<button class="secondary" onclick="exportData()">بیک اپ ڈاؤن لوڈ</button>
<button class="danger" onclick="clearAll()">تمام ریکارڈ حذف کریں</button>
</div>
<div style="overflow:auto">
<table>
<thead><tr><th>نام</th><th>شہر</th><th>فنڈ</th><th>تاریخ</th><th class="no-print">کارروائی</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
</div>

<script>
let records=JSON.parse(localStorage.getItem("shof_records")||"[]");
document.getElementById("date").valueAsDate=new Date();
document.getElementById("month").value=new Date().toISOString().slice(0,7);

function save(){localStorage.setItem("shof_records",JSON.stringify(records));render()}
function addRecord(){
 const r={
  name:name.value.trim(),address:address.value.trim(),city:city.value.trim(),
  saudi:saudi.value.trim(),pak:pak.value.trim(),fund:Number(fund.value||0),
  date:date.value,month:month.value
 };
 if(!r.name){alert("براہِ کرم نام لکھیں");return}
 records.push(r);save();clearForm();alert("ریکارڈ محفوظ ہوگیا");
}
function clearForm(){
 ["name","address","city","saudi","pak","fund"].forEach(id=>document.getElementById(id).value="");
 date.valueAsDate=new Date();month.value=new Date().toISOString().slice(0,7);
}
function del(i){if(confirm("یہ ریکارڈ حذف کریں؟")){records.splice(i,1);save()}}
function card(i){
 const r=records[i], w=window.open("","_blank");
 w.document.write(`<html lang="ur" dir="rtl"><head><meta charset="UTF-8"><title>ID Card</title>
 <style>body{font-family:Tahoma;padding:30px}.id{max-width:430px;border:2px solid #176b49;border-radius:18px;padding:22px;margin:auto;text-align:center}
 h1{color:#176b49}.row{text-align:right;padding:8px;border-bottom:1px solid #ddd}</style></head><body>
 <div class="id"><h1>شاد اوورسیز فاؤنڈیشن</h1><h2>فنڈ ادائیگی کارڈ</h2>
 <div class="row"><b>نام:</b> ${esc(r.name)}</div><div class="row"><b>شہر:</b> ${esc(r.city)}</div>
 <div class="row"><b>فنڈ:</b> ${r.fund}</div><div class="row"><b>تاریخ:</b> ${esc(r.date)}</div>
 <br><button onclick="print()">پرنٹ کریں</button></div></body></html>`);
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function exportData(){
 const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shad-overseas-foundation-backup.json";a.click();
}
function clearAll(){if(confirm("کیا واقعی تمام ریکارڈ حذف کرنے ہیں؟")){records=[];save()}}
function render(){
 rows.innerHTML=records.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${esc(r.city)}</td><td>${r.fund}</td><td>${esc(r.date)}</td>
 <td class="no-print"><button class="secondary" onclick="card(${i})">ID کارڈ</button> <button class="danger" onclick="del(${i})">حذف</button></td></tr>`).join("");
 peopleCount.textContent=records.length;
 totalFund.textContent=records.reduce((a,r)=>a+Number(r.fund||0),0);
 const m=new Date().toISOString().slice(0,7);
 monthFund.textContent=records.filter(r=>r.month===m).reduce((a,r)=>a+Number(r.fund||0),0);
}
render();
</script>
</body>
</html>
